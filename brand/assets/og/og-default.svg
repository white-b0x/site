<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <title>whiteb0x — Open Graph image (1200×630)</title>
  <desc>Default OG card. Brand registration mark as oversized background motif, wordmark centered, tagline below with aureate accent rule.</desc>

  <!-- Background -->
  <rect width="1200" height="630" fill="#030508"/>

  <!-- Subtle grid overlay (suggests precision drafting) -->
  <g stroke="#0e1218" stroke-width="1" opacity="0.6">
    <line x1="0"    y1="120"  x2="1200" y2="120"/>
    <line x1="0"    y1="510"  x2="1200" y2="510"/>
    <line x1="120"  y1="0"    x2="120"  y2="630"/>
    <line x1="1080" y1="0"    x2="1080" y2="630"/>
  </g>

  <!-- Oversized registration brackets (background motif) -->
  <g stroke="#1a1f28" stroke-width="6" fill="none" stroke-linecap="square">
    <path d="M120 280 L120 120 L280 120"/>
    <path d="M920 120 L1080 120 L1080 280"/>
    <path d="M1080 350 L1080 510 L920 510"/>
    <path d="M280 510 L120 510 L120 350"/>
  </g>

  <!-- Inner registration brackets (small, foreground accent in aureate) -->
  <g stroke="#d4a574" stroke-width="2.5" fill="none" stroke-linecap="square" opacity="0.85">
    <path d="M420 232 L420 220 L432 220"/>
    <path d="M768 220 L780 220 L780 232"/>
    <path d="M780 398 L780 410 L768 410"/>
    <path d="M432 410 L420 410 L420 398"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="335"
        font-family="Geist, ui-sans-serif, system-ui, sans-serif"
        font-size="128"
        font-weight="300"
        letter-spacing="-2.5"
        text-anchor="middle"
        fill="#f5f5f5">whiteb0x</text>

  <!-- Aureate accent rule -->
  <line x1="560" y1="378" x2="640" y2="378" stroke="#d4a574" stroke-width="1.5" opacity="0.7"/>

  <!-- Tagline -->
  <text x="600" y="410"
        font-family="Geist Mono, ui-monospace, SF Mono, Monaco, monospace"
        font-size="18"
        font-weight="500"
        letter-spacing="5.4"
        text-anchor="middle"
        fill="#d4a574">A DEVELOPMENT STUDIO</text>

  <!-- URL (mono, lower-right) -->
  <text x="1080" y="585"
        font-family="Geist Mono, ui-monospace, SF Mono, Monaco, monospace"
        font-size="16"
        font-weight="500"
        letter-spacing="0.5"
        text-anchor="end"
        fill="rgba(245,245,245,0.5)">whiteb0x.com</text>
</svg>
