<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <title>whiteb0x — Twitter Card (1200×675, 16:9)</title>
  <desc>Twitter summary_large_image card. Same composition as OG, retuned for 16:9 ratio.</desc>

  <rect width="1200" height="675" fill="#030508"/>

  <g stroke="#0e1218" stroke-width="1" opacity="0.6">
    <line x1="0"    y1="135"  x2="1200" y2="135"/>
    <line x1="0"    y1="540"  x2="1200" y2="540"/>
    <line x1="120"  y1="0"    x2="120"  y2="675"/>
    <line x1="1080" y1="0"    x2="1080" y2="675"/>
  </g>

  <g stroke="#1a1f28" stroke-width="6" fill="none" stroke-linecap="square">
