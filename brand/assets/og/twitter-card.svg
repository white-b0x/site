    <path d="M920 135 L1080 135 L1080 305"/>
    <path d="M1080 370 L1080 540 L920 540"/>
    <path d="M280 540 L120 540 L120 370"/>
  </g>

  <g stroke="#d4a574" stroke-width="2.5" fill="none" stroke-linecap="square" opacity="0.85">
