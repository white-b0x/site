<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="whiteb0x">
  <title>whiteb0x — Avatar C1 (cube grid)</title>
  <desc>Registration brackets with a faint 3×3 grid inside — the same gold grid shader that overlays the 3D hero cube, flattened into the 2D mark. Conceptually the most tied to the brand&#39;s signature visual.</desc>

  
  <rect width="1024" height="1024" fill="#030508"></rect>

  <defs>
    <radialGradient id="c1-bg" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.20"></stop>
      <stop offset="40%" stop-color="#ffd9a0" stop-opacity="0.08"></stop>
      <stop offset="100%" stop-color="#ffd9a0" stop-opacity="0"></stop>
    </radialGradient>
    <filter id="c1-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"></feGaussianBlur>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#c1-bg)"></rect>

  
  <g stroke="#ffd9a0" fill="none" stroke-width="3" opacity="0.45">
    <line x1="412" y1="212" x2="412" y2="812"></line>
    <line x1="612" y1="212" x2="612" y2="812"></line>
    <line x1="212" y1="412" x2="812" y2="412"></line>
    <line x1="212" y1="612" x2="812" y2="612"></line>
  </g>

  
  <g fill="none" stroke="#ffd9a0" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter" opacity="0.45" filter="url(#c1-soft)">
    <path d="M 287 287 L 212 287 L 212 362"></path>
    <path d="M 737 287 L 812 287 L 812 362"></path>
    <path d="M 812 662 L 812 737 L 737 737"></path>
    <path d="M 287 737 L 212 737 L 212 662"></path>
  </g>

  
  <g fill="none" stroke="#e9c47a" stroke-width="11" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M 287 287 L 212 287 L 212 362"></path>
    <path d="M 737 287 L 812 287 L 812 362"></path>
    <path d="M 812 662 L 812 737 L 737 737"></path>
    <path d="M 287 737 L 212 737 L 212 662"></path>
  </g>
</svg>