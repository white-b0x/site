<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="whiteb0x">
  <title>whiteb0x — Avatar C2.3 (echo with topographic depth)</title>
  <desc>Echo brackets above a receding wireframe ground plane — the brand&#39;s 3D-scene horizon distilled into a flat avatar. The brackets become a lens looking down on terrain.</desc>

  
  <rect width="1024" height="1024" fill="#030508"></rect>

  <defs>
    <radialGradient id="c23-fade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="black" stop-opacity="1"></stop>
      <stop offset="70%" stop-color="black" stop-opacity="0.55"></stop>
      <stop offset="100%" stop-color="black" stop-opacity="0"></stop>
    </radialGradient>
    <mask id="c23-mask">
      <rect width="1024" height="1024" fill="url(#c23-fade)"></rect>
    </mask>
    <radialGradient id="c23-glow" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.20"></stop>
      <stop offset="60%" stop-color="#ffd9a0" stop-opacity="0.04"></stop>
      <stop offset="100%" stop-color="#ffd9a0" stop-opacity="0"></stop>
    </radialGradient>
  </defs>

  
  <g mask="url(#c23-mask)">
    
    <g stroke="#ffd9a0" fill="none" stroke-width="1.1" opacity="0.18">
