<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 312" width="820" height="312" role="img" aria-label="whiteb0x — A Development Studio">
  <title>whiteb0x — Facebook Cover Photo</title>

  <defs>
    <radialGradient id="fbglow" gradientUnits="userSpaceOnUse"
      cx="410" cy="148" r="280">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#ffd9a0" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="fbgrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,217,160,0.055)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="820" height="312" fill="#030508"/>

  <!-- Grid texture -->
  <rect width="820" height="312" fill="url(#fbgrid)"/>

  <!-- Aureate glow -->
  <ellipse cx="410" cy="148" rx="320" ry="200" fill="url(#fbglow)"/>

  <!-- Outer corner brackets -->
  <g fill="none" stroke="#1a1f28" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M 75 20 L 20 20 L 20 75"/>
    <path d="M 745 20 L 800 20 L 800 75"/>
    <path d="M 745 292 L 800 292 L 800 237"/>
    <path d="M 75 292 L 20 292 L 20 237"/>
  </g>

  <!-- Middle brackets — aureate -->
  <g fill="none" stroke="#d4a574" stroke-width="1" stroke-linecap="square" stroke-linejoin="miter" opacity="0.55">
    <path d="M 93 55 L 55 55 L 55 93"/>
    <path d="M 727 55 L 765 55 L 765 93"/>
    <path d="M 727 257 L 765 257 L 765 219"/>
    <path d="M 93 257 L 55 257 L 55 219"/>
  </g>

  <!-- Registration mark — white, centered -->
  <g fill="none" stroke="#f5f5f5" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M 402 48 L 382 48 L 382 68"/>
    <path d="M 418 48 L 438 48 L 438 68"/>
    <path d="M 418 104 L 438 104 L 438 84"/>
    <path d="M 402 104 L 382 104 L 382 84"/>
  </g>

  <!-- Wordmark -->
  <text x="410" y="180"
    font-family="'Geist', 'Geist Sans', ui-sans-serif, system-ui, -apple-system, sans-serif"
    font-size="50" font-weight="300" letter-spacing="-1"
    text-anchor="middle" fill="#f5f5f5">whiteb0x</text>

  <!-- Tagline -->
  <text x="410" y="207"
    font-family="'Geist Mono', 'GeistMono', ui-monospace, 'SF Mono', Monaco, monospace"
    font-size="10" font-weight="500" letter-spacing="2.5"
    text-anchor="middle" fill="#d4a574">A DEVELOPMENT STUDIO</text>
</svg>
