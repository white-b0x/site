<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" role="img" aria-label="whiteb0x — A Development Studio">
  <title>whiteb0x — X Profile Banner</title>

  <defs>
    <radialGradient id="xglow" cx="50%" cy="50%" r="50%" gradientUnits="userSpaceOnUse"
      fx="750" fy="250" cx="750" cy="250" r="480">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#ffd9a0" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="xgrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255,217,160,0.055)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="#030508"/>

  <!-- Grid texture -->
  <rect width="1500" height="500" fill="url(#xgrid)"/>

  <!-- Aureate glow -->
  <ellipse cx="750" cy="230" rx="560" ry="340" fill="url(#xglow)"/>

  <!-- Outer corner brackets — gray, quiet structure -->
  <g fill="none" stroke="#1a1f28" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M 110 30 L 30 30 L 30 110"/>
    <path d="M 1390 30 L 1470 30 L 1470 110"/>
    <path d="M 1390 470 L 1470 470 L 1470 390"/>
    <path d="M 110 470 L 30 470 L 30 390"/>
  </g>

  <!-- Middle brackets — aureate -->
  <g fill="none" stroke="#d4a574" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" opacity="0.55">
    <path d="M 135 80 L 80 80 L 80 135"/>
    <path d="M 1365 80 L 1420 80 L 1420 135"/>
    <path d="M 1365 420 L 1420 420 L 1420 365"/>
    <path d="M 135 420 L 80 420 L 80 365"/>
  </g>

  <!-- Registration mark — white, centered -->
  <g fill="none" stroke="#f5f5f5" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M 735 115 L 705 115 L 705 145"/>
    <path d="M 765 115 L 795 115 L 795 145"/>
    <path d="M 765 205 L 795 205 L 795 175"/>
    <path d="M 735 205 L 705 205 L 705 175"/>
  </g>

  <!-- Wordmark -->
  <text x="750" y="310"
    font-family="'Geist', 'Geist Sans', ui-sans-serif, system-ui, -apple-system, sans-serif"
    font-size="76" font-weight="300" letter-spacing="-1.5"
    text-anchor="middle" fill="#f5f5f5">whiteb0x</text>

  <!-- Tagline -->
  <text x="750" y="348"
    font-family="'Geist Mono', 'GeistMono', ui-monospace, 'SF Mono', Monaco, monospace"
    font-size="15" font-weight="500" letter-spacing="3.5"
    text-anchor="middle" fill="#d4a574">A DEVELOPMENT STUDIO</text>
</svg>
